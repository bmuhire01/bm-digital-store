; The PHP settings for the server (Vercel takes this file away after the build)
; NOTE: only ";" starts a comment here, a "#" would break the whole file

; Do not show the errors in the browser - they go into the log of the server
display_errors = Off
log_errors = On

; Give the shop a bit more room
memory_limit = 256M

; Buffer the output so the redirect after a form still works
; (a header can only be sent while nothing has been printed yet)
output_buffering = 4096

; The sessions are kept in the database (see config/session_db.php)
session.gc_maxlifetime = 86400
session.use_cookies = 1
session.use_only_cookies = 1
session.use_strict_mode = 1
session.cookie_httponly = 1
